name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: jse-bt backtest --source synthetic --factor momentum --out reports/ci
      - run: jse-bt risk --source synthetic --out reports/ci-risk
      - run: jse-bt optimize --source synthetic --out reports/ci-optimize
      - run: jse-bt backtest --source synthetic --factor momentum --weighting risk_parity --out reports/ci-rp
      - run: jse-bt cost-grid --source synthetic --out reports/ci-grid
