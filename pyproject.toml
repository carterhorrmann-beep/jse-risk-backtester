[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jse-risk-backtester"
version = "2.0.0"
description = "Portfolio risk analytics and factor backtesting for JSE-listed equities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[project.scripts]
jse-bt = "jse_backtester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
